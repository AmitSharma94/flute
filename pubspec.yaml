name: flute_rc_v1
description: "flute - a private, offline music player for audio stored on your device."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_native_splash: ^2.4.8

  on_audio_query: ^2.9.0

  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  home_widget: ^0.9.3
  permission_handler: ^12.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/flute_icon.png

flutter_launcher_icons:
  android: true
  ios: true

  image_path: assets/icons/flute_icon.png

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icons/flute_icon.png

flutter_native_splash:
  color: "#121212"
  image: assets/icons/flute_icon.png

  android: true
  ios: true

  android_12:
    color: "#121212"
    image: assets/icons/flute_icon.png