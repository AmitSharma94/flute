name: Flutter Android Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch on_audio_query_android Namespace
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/on_audio_query_android-1.1.0/android/build.gradle"

          echo "Patching: $FILE"

          if ! grep -q "namespace" "$FILE"; then
            sed -i '/android {/a\    namespace "com.lucasjosino.on_audio_query"' "$FILE"
          fi

          cat "$FILE"

      - name: Analyze Project
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flute-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk