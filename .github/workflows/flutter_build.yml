name: Flute Release Candidate Build

on:
  workflow_dispatch:
  push:
    branches:
      - stable
      - "release/**"

permissions:
  contents: read

jobs:
  build:
    name: Build release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Rename build artifacts
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            release-artifacts/flute-release.apk
          cp build/app/outputs/bundle/release/app-release.aab \
            release-artifacts/flute-release.aab
          ls -lh release-artifacts

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: flute-release-apk
          path: release-artifacts/flute-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: flute-release-aab
          path: release-artifacts/flute-release.aab
          if-no-files-found: error
          retention-days: 30
