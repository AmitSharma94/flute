name: Flute Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch on_audio_query Android compatibility
        run: |
          GRADLE_FILE=$(find ~/.pub-cache -path "*on_audio_query_android-1.1.0/android/build.gradle" | head -1)
          MANIFEST_FILE=$(find ~/.pub-cache -path "*on_audio_query_android-1.1.0/android/src/main/AndroidManifest.xml" | head -1)

          sed -i '/android {/a\
              namespace "com.lucasjosino.on_audio_query_android"\
              compileSdkVersion 35\
              compileOptions {\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }' "$GRADLE_FILE"

          sed -i '/android {/a\
          kotlinOptions {\
              jvmTarget = "17"\
          }' "$GRADLE_FILE"

          sed -i 's/package="com.lucasjosino.on_audio_query"//' "$MANIFEST_FILE"

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flute-v0.1.0-alpha-preview
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}