name: Flutter Android Build

on:
  push:
    branches:
      - main
      - feature/day-1-foundation

  pull_request:
    branches:
      - main
      - feature/day-1-foundation

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Patch on_audio_query namespace
        run: |
          FILE=$(find ~/.pub-cache -path "*on_audio_query_android-1.1.0/android/build.gradle")
          echo "Patching $FILE"
          sed -i '/android {/a\    namespace "com.lucasjosino.on_audio_query_android"' "$FILE"

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flute-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk