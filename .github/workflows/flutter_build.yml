name: Flutter Build

on:
  push:
    branches:
      - main
      - feature/day-1-foundation
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter build apk --release