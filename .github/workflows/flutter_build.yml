name: Flutter Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable
      - develop
      - "feature/**"
      - "fix/**"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

          APK_PATH=$(find build android -type f -name "*debug*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "No debug APK was generated."
            exit 1
          fi

          echo "APK found at: $APK_PATH"
          mkdir -p release-artifacts
          cp "$APK_PATH" release-artifacts/flute-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flute-debug-apk
          path: release-artifacts/flute-debug.apk
          retention-days: 14