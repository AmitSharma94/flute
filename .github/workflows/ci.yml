name: Flutter CI Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - stable
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-build:
    name: Format, Analyze, Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart files
        run: dart format lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Restore Gradle wrapper if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android /tmp/flute_wrapper
            cp /tmp/flute_wrapper/android/gradlew android/gradlew
            cp /tmp/flute_wrapper/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/flute_wrapper/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
            cp /tmp/flute_wrapper/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/
          fi
          chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and rename APK
        run: |
          APK_PATH=$(find build android -type f -path "*release*" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK was not found."
            find . -type f -name "*.apk" -print
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$APK_PATH" release-artifacts/flute-release.apk
          ls -lh release-artifacts

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: flute-release-apk
          path: release-artifacts/flute-release.apk
          if-no-files-found: error
          retention-days: 30
